<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 2</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8 font-sans">

    <div class="max-w-6xl mx-auto">
        <header class="text-center mb-12">
            <h1 class="text-5xl font-extrabold text-blue-800 mb-8">Dockerized S3 Image Gallery</h1>
        </header>

        <main class="grid md:grid-cols-3 gap-8">            
            <!-- Image 1 -->
            <div class=" bg-white p-4 rounded-xl shadow-lg border border-gray-100">
                <img 
                    src="https://nwai2-comp-4964-assignment2-images.s3.us-west-2.amazonaws.com/img1.png" 
                    alt="Placeholder Image 1 from S3" 
                    onerror="this.onerror=null; this.src='https://placehold.co/600x400/38a169/ffffff?text=Failed+to+Load+Image+1';"
                    class="w-full h-auto rounded-lg object-cover mb-4 aspect-video"
                >
                <h2 class="text-xl font-semibold text-gray-800">Image 1</h2>
                
            </div>

            <!-- Image 2 -->
            <div class=" bg-white p-4 rounded-xl shadow-lg border border-gray-100">
                <img 
                    src="https://nwai2-comp-4964-assignment2-images.s3.us-west-2.amazonaws.com/img2.png" 
                    alt="Placeholder Image 2 from S3" 
                    onerror="this.onerror=null; this.src='https://placehold.co/600x400/9f7aea/ffffff?text=Failed+to+Load+Image+2';"
                    class="w-full h-auto rounded-lg object-cover mb-4 aspect-video"
                >
                <h2 class="text-xl font-semibold text-gray-800">Image 2</h2>
                
            </div>

            <!-- Image 3 -->
            <div class=" bg-white p-4 rounded-xl shadow-lg border border-gray-100">
                <img 
                    src="https://nwai2-comp-4964-assignment2-images.s3.us-west-2.amazonaws.com/img3.png" 
                    alt="Placeholder Image 3 from S3" 
                    onerror="this.onerror=null; this.src='https://placehold.co/600x400/f6ad55/000000?text=Failed+to+Load+Image+3';"
                    class="w-full h-auto rounded-lg object-cover mb-4 aspect-video"
                >
                <h2 class="text-xl font-semibold text-gray-800">Image 3</h2>
                
            </div>
        </main>
    </div>

</body>
</html>
